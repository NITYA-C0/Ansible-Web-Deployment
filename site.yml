---
- name: Automated Web Server Deployment
  hosts: web
  become: yes
  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
    - name: Install Apache
      apt:
        name: apache2
        state: present
    - name: Copy Website
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
    - name: Start Apache Service
      service:
        name: apache2
        state: started
        enabled: yes
